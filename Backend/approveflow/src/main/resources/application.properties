spring.application.name=approveflow
spring.datasource.url=jdbc:mysql://localhost:3306/approveflow
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-minutes=60

app.seed.password=${SEED_PASSWORD:Demo@12345}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC